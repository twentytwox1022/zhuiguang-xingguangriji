<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>追光 ✨ 追星成长助手</title>
    <style>
        /* ===== 全局重置 & 基础【移动端优化增强】 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            padding: 16px 16px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0b0719;
            position: relative;
            overflow-x: hidden;
            max-width: 100vw;
            font-size:16px;
        }
        input,textarea,button{
            font-size:16px;
        }
        /* 星空背景 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139,92,246,0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(236,72,153,0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(59,130,246,0.15) 0%, transparent 50%),
                #0b0719;
            z-index: -2;
        }
        /* 星星闪烁 */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                radial-gradient(2px 2px at 10% 20%, #fff, transparent),
                radial-gradient(2px 2px at 30% 60%, #fff, transparent),
                radial-gradient(1px 1px at 50% 10%, #fff, transparent),
                radial-gradient(2px 2px at 70% 80%, #fff, transparent),
                radial-gradient(1px 1px at 90% 30%, #fff, transparent),
                radial-gradient(2px 2px at 15% 85%, #fff, transparent),
                radial-gradient(1px 1px at 55% 45%, #fff, transparent),
                radial-gradient(2px 2px at 85% 65%, #fff, transparent),
                radial-gradient(1px 1px at 40% 30%, #fff, transparent),
                radial-gradient(2px 2px at 95% 90%, #fff, transparent),
                radial-gradient(1px 1px at 5% 50%, #fff, transparent),
                radial-gradient(2px 2px at 75% 15%, #fff, transparent);
            background-size: 200px 200px;
            background-repeat: repeat;
            opacity: 0.5;
            z-index: -1;
            animation: twinkle 4s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }
        /* ===== 头部 ===== */
        .header {
            text-align: center;
            padding: 20px 20px 10px;
            position: relative;
            z-index: 1;
        }
        .header::before {
            content: "🌟";
            font-size: 40px;
            display: block;
            margin-bottom: 4px;
            animation: pulseStar 2s ease-in-out infinite;
        }
        @keyframes pulseStar {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            font-weight: 800;
        }
        .header p {
            color: #a78bfa;
            font-size: 13px;
            margin-top: 4px;
            opacity: 0.8;
            font-weight: 400;
        }
        /* ===== Tab 切换【增强换行、最小点击高度】 ===== */
        .tabs {
            display: flex;
            gap: 6px;
            margin: 12px 0 6px;
            width: 100%;
            max-width: 460px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 1;
        }
        .tabs button {
            flex: 1 0 auto;
            min-width: 56px;
            min-height:40px;
            padding: 8px 10px;
            border: none;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.08);
            color: #c4b5fd;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.05);
            flex-shrink:0;
        }
        .tabs button.active {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
            box-shadow: 0 4px 16px rgba(139,92,246,0.3);
            border-color: transparent;
        }
        .tabs button:hover {
            transform: translateY(-2px);
        }
        /* ===== 通用卡片 ===== */
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 20px 18px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.06);
            margin: 8px 0 16px;
            z-index: 1;
        }
        .card label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #c4b5fd;
            margin-bottom: 6px;
        }
        .card input, .card textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            font-size: 16px;
            background: rgba(255,255,255,0.06);
            margin-bottom: 14px;
            transition: all 0.3s ease;
            outline: none;
            font-family: inherit;
            color: #e5e7eb;
        }
        .card input:focus, .card textarea:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139,92,246,0.15);
            background: rgba(255,255,255,0.1);
        }
        .card input::placeholder, .card textarea::placeholder {
            color: #6b7280;
        }
        .card textarea {
            min-height: 100px;
            resize: vertical;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
            border: none;
            padding: 12px 0;
            width: 100%;
            font-size: 15px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 24px rgba(139,92,246,0.3);
            letter-spacing: 0.5px;
            min-height:48px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(139,92,246,0.4);
        }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        /* ===== 列表/结果展示【修复日记日期溢出，重点】 ===== */
        .list-area {
            width: 100%;
            max-width: 460px;
            z-index: 1;
            max-width:100%;
            overflow-x:hidden;
        }
        .list-area h2 {
            font-size: 16px;
            color: #c4b5fd;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .entry-item {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(8px);
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 10px;
            border-left: 4px solid #8b5cf6;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
            width:100%;
            max-width:100%;
            box-sizing: border-box;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .entry-item .entry-date {
            font-size: 11px;
            color: #8b5cf6;
            font-weight: 700;
            display:inline-block;
            max-width:100%;
            overflow-wrap:break-word;
            word-break:break-all;
        }
        .entry-item .entry-text {
            font-size: 14px;
            color: #e5e7eb;
            margin-top: 4px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: break-word;
            max-width:100%;
        }
        .entry-item .entry-text a {
            color:#a78bfa;
            text-decoration:underline;
            margin:0 4px;
        }
        .empty-tip {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            padding: 24px 0;
            line-height: 2;
        }
        /* ===== 对话专用 ===== */
        .chat-box {
            max-height: 260px;
            overflow-y: auto;
            margin-bottom: 14px;
            padding-right: 4px;
        }
        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-thumb { background: #4c1d95; border-radius: 10px; }
        .chat-msg {
            padding: 10px 14px;
            border-radius: 16px;
            margin-bottom: 8px;
            max-width: 92%;
            line-height: 1.6;
            font-size: 14px;
            animation: fadeIn 0.3s ease;
            word-break:break-word;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-msg.user {
            background: linear-gradient(135deg, #4c1d95, #7c3aed);
            color: #e5e7eb;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .chat-msg.ai {
            background: rgba(255,255,255,0.08);
            color: #e5e7eb;
            margin-right: auto;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .chat-msg .role-tag {
            font-size: 10px;
            font-weight: 600;
            color: #a78bfa;
            display: block;
            margin-bottom: 2px;
        }
        .typing-indicator {
            display: none;
            color: #a78bfa;
            font-size: 13px;
            padding: 6px 0;
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        /* ===== 演播室单选控件 ===== */
        .radio-row{
            display:flex;
            gap:24px;
            margin:14px 0;
            flex-wrap:wrap;
        }
        .radio-item{
            display:flex;
            align-items:center;
            gap:6px;
            color:#e5e7eb;
        }
        /* ===== 页面切换 ===== */
        .page { display: none; }
        .page.active { display: block; }
        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4c1d95; border-radius: 10px; }
        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .tabs button { font-size: 11px; padding: 6px 8px; min-width: 44px; }
            .header h1 { font-size: 22px; }
            .card { padding: 16px 14px; }
        }
    </style>
</head>
<body>
<!-- ===== 头部 ===== -->
<div class="header">
    <h1>✨ 追光</h1>
    <p>今天，你又靠近光了一点</p>
</div>
<!-- ===== Tab 切换（两行） ===== -->
<div class="tabs">
    <button class="active" data-tab="diary" onclick="switchTab('diary')">📖 日记</button>
    <button data-tab="mirror" onclick="switchTab('mirror')">🪞 清醒镜</button>
    <button data-tab="map" onclick="switchTab('map')">🗺️ 成长</button>
</div>
<div class="tabs" style="margin-top:4px;">
    <button data-tab="outfit" onclick="switchTab('outfit')">💜 穿搭</button>
    <button data-tab="gift" onclick="switchTab('gift')">🎁 礼物</button>
    <button data-tab="route" onclick="switchTab('route')">🗺️ 路线</button>
    <button data-tab="studio" onclick="switchTab('studio')">🎙演播室</button>
</div>
 <!-- ============================================================ -->
<!-- ===== 页面1：星光日记 ===== -->
<div id="page-diary" class="page active">
    <div class="card">
        <label>📅 日期</label>
        <input type="date" id="diary-date">
        <label>💬 今天做了什么？</label>
        <textarea id="diary-text" placeholder="比如：今天学会了一首新歌，是ta翻唱的那首…"></textarea>
        <button class="btn-primary" onclick="saveDiary()">🌟 记录今天</button>
    </div>
    <div class="list-area">
        <h2>📖 我的星光记录</h2>
        <div id="diary-entries"></div>
    </div>
</div>
<!-- ===== 页面2：追星清醒镜 ===== -->
<div id="page-mirror" class="page">
    <div class="card">
        <label>💭 和「清醒镜」聊聊你的追星心情</label>
        <div class="chat-box" id="chat-box">
            <div class="chat-msg ai">
                <span class="role-tag">🪞 清醒镜</span>
                嗨！我是你的追星清醒镜 ✨<br>
                来聊聊吧——无论是买周边的犹豫、追行程的纠结，还是想和偶像一样变得更好，我都在这里陪你理性思考 💜
            </div>
        </div>
        <div class="typing-indicator" id="typing-indicator">🪞 清醒镜正在思考…</div>
        <textarea id="mirror-input" placeholder="说点什么吧…比如：我好想买这张专辑，但有点贵…" rows="2"></textarea>
        <button class="btn-primary" id="mirror-btn" onclick="askMirror()">🪞 问清醒镜</button>
    </div>
</div>
<!-- ===== 页面3：成长地图 ===== -->
<div id="page-map" class="page">
    <div class="card">
        <label>🌟 你的偶像身上，最吸引你的特质是什么？</label>
        <textarea id="map-input" placeholder="比如：ta跳舞超有力量感 / ta英语特别流利…" rows="2"></textarea>
        <button class="btn-primary" id="map-btn" onclick="generateMap()">🗺️ 生成成长地图</button>
    </div>
    <div class="list-area">
        <h2>🎯 我的成长目标</h2>
        <div id="goal-entries"></div>
    </div>
</div>
<!-- ===== 页面4：应援穿搭师 ===== -->
<div id="page-outfit" class="page">
    <div class="card">
        <label>💜 你的偶像应援色是什么？或你想穿什么颜色？</label>
        <textarea id="outfit-input" placeholder="比如：紫色 / 珊瑚粉 / 我家爱豆的应援色是黄蓝色…" rows="2"></textarea>
        <button class="btn-primary" id="outfit-btn" onclick="askOutfit()">💜 帮我搭配</button>
    </div>
    <div class="list-area">
        <h2>✨ 穿搭建议</h2>
        <div id="outfit-result"><div class="empty-tip">输入应援色或颜色，AI会帮你推荐穿搭 🎀</div></div>
    </div>
</div>
<!-- ===== 页面5：同担礼物坊 ===== -->
<div id="page-gift" class="page">
    <div class="card">
        <label>🎁 你想做什么类型的小礼物？送给同担的～</label>
        <textarea id="gift-input" placeholder="比如：手幅 / 钥匙扣 / 小卡套 / 透卡…" rows="2"></textarea>
        <button class="btn-primary" id="gift-btn" onclick="askGift()">🎁 给我教程</button>
    </div>
    <div class="list-area">
        <h2>📦 礼物制作方案</h2>
        <div id="gift-result"><div class="empty-tip">输入礼物类型，AI会给你详细教程和成本 🧵</div></div>
    </div>
</div>
<!-- ===== 页面6：追星路线规划 ===== -->
<div id="page-route" class="page">
    <div class="card">
        <label>🗺️ 从哪里出发？去哪里？</label>
        <textarea id="route-input" placeholder="比如：广州天河 → 深圳宝安体育馆，周六下午出发" rows="2"></textarea>
        <button class="btn-primary" id="route-btn" onclick="askRoute()">🗺️ 规划路线</button>
    </div>
    <div class="list-area">
        <h2>🚇 出行方案推荐</h2>
        <div id="route-result"><div class="empty-tip">输入出发地和目的地，AI会帮你规划路线 🚌</div></div>
    </div>
</div>
<!-- ===== 页面7：🎙虚拟演播室【新增】 ===== -->
<div id="page-studio" class="page">
    <div class="card">
        <label>🎙虚拟演播室｜输入关键词搜索舞台/片段</label>
        <input id="studio-keyword" placeholder="例如：朱志鑫 高光舞台">
        <div class="radio-row">
            <div class="radio-item">
                <input type="radio" name="studio-plat" id="plat-bili" value="bilibili" checked>
                <label for="plat-bili">B站</label>
            </div>
            <div class="radio-item">
                <input type="radio" name="studio-plat" id="plat-douyin" value="douyin">
                <label for="plat-douyin">抖音</label>
            </div>
        </div>
        <button class="btn-primary" onclick="startStudio()">▶ 演播室启动</button>
        <div id="studio-output" style="margin-top:16px;color:#c4b5fd;font-size:13px;white-space:pre-wrap;">等待指令……</div>
        <div style="margin-top:10px;font-size:11px;color:#6b7280;">⚠️微信浏览器会拦截App唤起；请使用系统浏览器。Scheme链接为非官方接口，版本更新可能失效。</div>
    </div>
</div>
<!-- ============================================================ -->
<script>
// ==================================================================
// 配置：请在这里填入你的 DeepSeek API Key
// ==================================================================
var DEEPSEEK_API_KEY = 'sk-12b0226d034843deb811690ea1f8b1de';
// ==================================================================
// 1. 星光日记
// ==================================================================
window.onload = function() {
    displayDiaries();
    loadGoals();
};
function saveDiary() {
    var date = document.getElementById('diary-date').value;
    var text = document.getElementById('diary-text').value.trim();
    if (!date) { alert('请选择日期 📅'); return; }
    if (!text) { alert('请写点什么吧 💬'); return; }
    var diaries = JSON.parse(localStorage.getItem('zhuiGuangDiaries')) || [];
    diaries.push({ date: date, text: text, time: new Date().toLocaleString() });
    localStorage.setItem('zhuiGuangDiaries', JSON.stringify(diaries));
    document.getElementById('diary-date').value = '';
    document.getElementById('diary-text').value = '';
    displayDiaries();
    alert('🌟 星光已记录！');
}
function displayDiaries() {
    var container = document.getElementById('diary-entries');
    var diaries = JSON.parse(localStorage.getItem('zhuiGuangDiaries')) || [];
    if (diaries.length === 0) {
        container.innerHTML = '<div class="empty-tip">还没有星光记录 ✨<br>今天做了什么？写下来吧</div>';
        return;
    }
    diaries.reverse();
    var html = '';
    for (var i = 0; i < diaries.length; i++) {
        var d = diaries[i];
        html += '<div class="entry-item">' +
            '<div class="entry-date">📅 ' + d.date.replace(/-/g, '/') + '</div>' +
            '<div class="entry-text">' + escapeHtml(d.text) + '</div>' +
            '</div>';
    }
    container.innerHTML = html;
}
function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
// ==================================================================
// 2. 成长地图（含加载、保存、打卡）
// ==================================================================
function generateMap() {
    var input = document.getElementById('map-input');
    var text = input.value.trim();
    if (!text) { alert('🌟 说说你偶像最吸引你的特质吧～'); return; }
    var btn = document.getElementById('map-btn');
    btn.disabled = true;
    btn.textContent = '🗺️ 生成中…';
    var systemPrompt =
        '你是「追光」的成长地图规划师。把用户输入的一个偶像特质，拆解成4个可执行的小目标，分布在4周内完成。' +
        '目标要具体、可执行、适合普通人。请按以下格式输出（每周一行）：\n' +
        '第1周：[目标描述]\n第2周：[目标描述]\n第3周：[目标描述]\n第4周：[目标描述]';
    callDeepSeek(systemPrompt, text)
        .then(function(reply) {
            var goals = parseGoals(reply);
            saveGoals(goals);
            renderGoals(goals);
            input.value = '';
        })
        .catch(function(err) {
            alert('生成失败：' + err.message);
        })
        .finally(function() {
            btn.disabled = false;
            btn.textContent = '🗺️ 生成成长地图';
        });
}
function parseGoals(reply) {
    var lines = reply.split('\n');
    var goals = [];
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (line.match(/第\d+周[：:]/)) {
            var text = line.replace(/第\d+周[：:]\s*/, '').trim();
            if (text) goals.push({ text: text, done: false });
        }
    }
    if (goals.length === 0) goals = [{ text: reply.replace(/\n/g, ' '), done: false }];
    return goals;
}
function saveGoals(goals) {
    localStorage.setItem('zhuiGuangGoals', JSON.stringify(goals));
}
function loadGoals() {
    var goals = JSON.parse(localStorage.getItem('zhuiGuangGoals'));
    if (goals && goals.length > 0) renderGoals(goals);
}
function renderGoals(goals) {
    var container = document.getElementById('goal-entries');
    if (!goals || goals.length === 0) {
        container.innerHTML = '<div class="empty-tip">还没有成长目标 🗺️</div>';
        return;
    }
    var html = '';
    for (var i = 0; i < goals.length; i++) {
        var g = goals[i];
        var checkMark = g.done ? '✅' : '⬜';
        html += '<div class="entry-item" style="border-left-color:#fbbf24;">' +
            '<span style="cursor:pointer;font-size:20px;margin-right:10px;" onclick="toggleGoal(' + i + ')">' + checkMark + '</span>' +
            '<div class="entry-text">🎯 第' + (i+1) + '周：' + escapeHtml(g.text) + '</div>' +
            '</div>';
    }
    container.innerHTML = html;
}

function switchTab(tab) {
    document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
    document.querySelectorAll('.tabs button').forEach(btn=>btn.classList.remove('active'));
    const pageDom = document.getElementById('page-' + tab);
    if(pageDom) pageDom.classList.add('active');
    // 匹配所有按钮data‑tab属性，高亮当前tab
    document.querySelectorAll(`button[data-tab="${tab}"]`).forEach(btn=>{
        btn.classList.add('active');
    });
}
// ==================================================================
// 9. DeepSeek API 通用调用
// ==================================================================
function callDeepSeek(systemPrompt, userMessage) {
    return new Promise(function(resolve, reject) {
        var url = 'https://api.deepseek.com/v1/chat/completions';
        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + DEEPSEEK_API_KEY
            },
            body: JSON.stringify({
                model: 'deepseek-chat',
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userMessage }
                ],
                temperature: 0.7,
                max_tokens: 1500
            })
        })
        .then(function(response) {
            if (!response.ok) {
                return response.json().then(function(data) {
                    throw new Error(data.error?.message || 'API请求失败，状态码：' + response.status);
                });
            }
            return response.json();
        })
        .then(function(data) {
            var reply = data.choices[0].message.content;
            resolve(reply);
        })
        .catch(function(err) {
            reject(err);
        });
    });
}
